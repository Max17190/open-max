name: Suite CPU profile

# Temporary: measures the CPU each test binary and each test spends on one
# runner, to find what to cut. Removed before review.
on:
  push:
    branches: [test/suite-time-headroom]

defaults:
  run:
    shell: bash

env:
  CARGO_TERM_COLOR: always

jobs:
  profile:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # master, 2026-10-01
        with:
          toolchain: stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: test
          save-if: false

      - name: Tools
        run: |
          sudo apt-get install -y time linux-tools-common "linux-tools-$(uname -r)" > /dev/null 2>&1 || sudo apt-get install -y time linux-tools-azure > /dev/null 2>&1 || true
          perf --version || echo "no perf"
          sudo sysctl -w kernel.perf_event_paranoid=-1 || true
          lscpu | head -20

      - name: Build the tests
        run: cargo test --workspace --locked --no-run

      - name: The whole suite under perf, every CPU
        run: |
          mkdir -p prof
          sudo sysctl -w kernel.kptr_restrict=0 kernel.perf_event_paranoid=-1
          perf record -a -g -F 499 -o prof/suite.data -- scripts/check-suite-time.sh 3 > prof/suite-perf.log 2>&1 || true
          tail -n 3 prof/suite-perf.log
          r() { perf report -i prof/suite.data --no-children "$@" --stdio 2>/dev/null | grep -E '^ +[0-9]' | sed -n '1,45p'; }
          echo "== by command"; r --sort comm -g none
          echo "== by dso"; r --sort dso -g none
          echo "== by symbol"; r --sort dso,sym -g none
          echo "== kernel symbols"; r --sort sym -g none --dsos '[kernel.kallsyms]'
          echo "== kernel symbols with callers (top)"
          perf report -i prof/suite.data --no-children --sort sym --dsos '[kernel.kallsyms]' --stdio -G 2>/dev/null | grep -v '^$' | sed -n '1,200p'
          exe=$(ls -t target/debug/openmax | head -n 1)
          echo "== the debug openmax binary: $(stat -c %s "$exe") bytes, $(readelf -r "$exe" | grep -c R_X86_64_RELATIVE) relative relocations, $(readelf -r "$exe" | grep -c R_X86_64_) relocations"
          perf stat -r 50 -e task-clock,page-faults "$exe" --version 2>&1 > /dev/null | grep -E 'task-clock|page-faults|elapsed'

      - name: Suite at three pool widths, interleaved
        run: |
          for pool in 32 16 8; do
            sed "s/^threads=32$/threads=$pool/" scripts/check-suite-time.sh > "prof/check-$pool.sh"; chmod +x "prof/check-$pool.sh"
            grep -c "^threads=$pool$" "prof/check-$pool.sh"
          done
          busy() { awk '/^cpu /{ print $2+$3+$4+$7+$8 }' /proc/stat; }
          for round in 1 2 3 4; do
            for pool in 32 16 8; do
              b=$(busy)
              env -u GITHUB_ACTIONS "prof/check-$pool.sh" 3 > "prof/suite-$pool-$round.log" 2>&1 || true
              a=$(busy)
              echo "pool $pool round $round: $(grep -oE 'the test suite took [0-9.]+s' "prof/suite-$pool-$round.log") cpu $(echo "($a - $b) / $(getconf CLK_TCK)" | bc -l | cut -c1-6) retried=$(grep -c 'passed alone' "prof/suite-$pool-$round.log")"
            done
          done | tee prof/pools-suite.txt

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() }}
        with:
          name: suite-cpu-profile-2
          path: |
            prof
            !prof/suite.data
