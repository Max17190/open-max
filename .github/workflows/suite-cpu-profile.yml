name: Suite CPU profile

# Temporary: measures the CPU each test binary and each test spends on one
# runner, to find what to cut. Removed before review.
on:
  push:
    branches: [test/suite-time-headroom]

defaults:
  run:
    shell: bash

env:
  CARGO_TERM_COLOR: always

jobs:
  profile:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # master, 2026-10-01
        with:
          toolchain: stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: test
          save-if: false

      - name: Tools
        run: |
          sudo apt-get install -y time linux-tools-common "linux-tools-$(uname -r)" > /dev/null 2>&1 || sudo apt-get install -y time linux-tools-azure > /dev/null 2>&1 || true
          perf --version || echo "no perf"
          sudo sysctl -w kernel.perf_event_paranoid=-1 || true
          lscpu | head -20

      - name: Build the tests
        run: cargo test --workspace --locked --no-run

      - name: Pools and faults per binary
        run: |
          mkdir -p prof
          cargo test --workspace --locked --no-run --message-format=json 2>/dev/null |
            perl -MJSON::PP -ne 'my $m = decode_json($_); next unless $m->{reason} eq "compiler-artifact" && defined $m->{executable} && $m->{profile}{test};
              (my $d = $m->{manifest_path}) =~ s{/Cargo\.toml$}{}; print join("\t", $d, "$m->{target}{name}($m->{target}{kind}[0])", $m->{executable}), "\n"' > prof/binaries.tsv
          for name in 'open_max_core(lib)' 'cli(test)' 'openmax(bin)' 'stream_faults(test)'; do
            IFS=$'\t' read -r dir _ exe < <(grep -F "	$name	" prof/binaries.tsv)
            for pool in 32 8 4; do
              (cd "$dir" && /usr/bin/time -v "$exe" --test-threads $pool > /dev/null 2> "$GITHUB_WORKSPACE/prof/v.txt") || true
              echo "$name pool=$pool $(grep -E 'Elapsed|User time|System time|Minor|Voluntary context|Involuntary context' prof/v.txt | sed -E 's/^\s+//; s/ \(.*\)//' | tr '\n' ';')"
            done
          done | tee prof/pools.txt

      - name: Where the core library's system time goes
        run: |
          IFS=$'\t' read -r dir _ exe < <(grep -F "	open_max_core(lib)	" prof/binaries.tsv)
          cd "$dir"
          if command -v perf > /dev/null; then
            perf stat -e task-clock,page-faults,minor-faults,context-switches,cpu-migrations -- "$exe" --test-threads 32 > /dev/null 2> "$GITHUB_WORKSPACE/prof/perf-stat.txt" || true
            cat "$GITHUB_WORKSPACE/prof/perf-stat.txt"
            perf record -F 999 -g -o "$GITHUB_WORKSPACE/prof/perf.data" -- "$exe" --test-threads 32 > /dev/null 2>&1 || true
            perf report -i "$GITHUB_WORKSPACE/prof/perf.data" --no-children --sort dso,symbol --stdio 2>/dev/null | grep -v '^$' | grep -E '^ +[0-9]' | head -60
            echo; echo "by comm:"
            perf report -i "$GITHUB_WORKSPACE/prof/perf.data" --no-children --sort comm --stdio 2>/dev/null | grep -E '^ +[0-9]' | head -20
            echo; echo "kernel callers of the top kernel symbols:"
            perf report -i "$GITHUB_WORKSPACE/prof/perf.data" --no-children --sort symbol --stdio -G 2>/dev/null | grep -v '^$' | head -150
          fi
          strace -f -c -e trace=clone,clone3,fork,vfork,execve -o "$GITHUB_WORKSPACE/prof/strace.txt" "$exe" --test-threads 32 > /dev/null 2>&1 || true
          cat "$GITHUB_WORKSPACE/prof/strace.txt"

      - name: Suite at three pool widths, interleaved
        run: |
          for pool in 32 16 8; do
            sed "s/^threads=32$/threads=$pool/" scripts/check-suite-time.sh > "prof/check-$pool.sh"; chmod +x "prof/check-$pool.sh"
            grep -c "^threads=$pool$" "prof/check-$pool.sh"
          done
          busy() { awk '/^cpu /{ print $2+$3+$4+$7+$8 }' /proc/stat; }
          for round in 1 2 3 4; do
            for pool in 32 16 8; do
              b=$(busy)
              env -u GITHUB_ACTIONS "prof/check-$pool.sh" 3 > "prof/suite-$pool-$round.log" 2>&1 || true
              a=$(busy)
              echo "pool $pool round $round: $(grep -oE 'the test suite took [0-9.]+s' "prof/suite-$pool-$round.log") cpu $(echo "($a - $b) / $(getconf CLK_TCK)" | bc -l | cut -c1-6) retried=$(grep -c 'passed alone' "prof/suite-$pool-$round.log")"
            done
          done | tee prof/pools-suite.txt

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() }}
        with:
          name: suite-cpu-profile-2
          path: |
            prof
            !prof/perf.data
