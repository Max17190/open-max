name: Release build

# A release tag builds every target in Cargo.toml's [workspace.metadata.dist]
# and publishes nothing unless all of them build, so each one is built here,
# on the runner `dist plan` assigns it and with the packages the release
# installs there, and a target that stops building fails here instead of at
# the next release. Each binary's size is gated here too, and only here: a
# tag reads no size budget, so cut a release from a commit whose run of this
# workflow passed. The six builds would be the slowest part of the
# pull-request gate (the one on a macOS Intel runner takes four to seven
# minutes), so they are not part of it. They run on every push to main, so
# the merge that broke a target fails within minutes of landing; every
# night, as a new stable Rust or runner image can break a target with no
# commit at all; and on every merge group, so that a merge queue, once the
# repository has one, keeps the change that would break a target out of
# main. A pull request that changes what these builds read (Cargo.toml,
# Cargo.lock, the size budgets) can run them on its branch before it merges:
# `gh workflow run release-build.yml --ref <branch>`.
# crates/tui/tests/release.rs keeps this matrix equal to the published targets
# and their runners, and holds these triggers.
on:
  push:
    branches: [main]
  merge_group:
  schedule:
    - cron: "23 6 * * *"
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

# Every action is pinned to a full commit SHA, with its release in a trailing
# comment, as ci.yml explains.
jobs:
  release-build:
    name: Release build (${{ matrix.target }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            runner: macos-15
          - target: x86_64-apple-darwin
            runner: macos-15-intel
          - target: aarch64-unknown-linux-gnu
            runner: ubuntu-22.04-arm
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-22.04
          - target: aarch64-unknown-linux-musl
            runner: ubuntu-22.04-arm
          - target: x86_64-unknown-linux-musl
            runner: ubuntu-22.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      # ring compiles C, and a musl target needs musl's C toolchain for it.
      - name: Install musl tools
        if: endsWith(matrix.target, '-musl')
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # master, 2026-10-01
        with:
          toolchain: stable
          targets: ${{ matrix.target }}

      # Only main saves these: six targets' caches from every other branch
      # would push main's out of the repository's cache space.
      - name: Cache cargo
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: ${{ matrix.target }}
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Build release binary
        run: cargo build --release -p openmax --locked --target ${{ matrix.target }}

      # Hard gate: the job fails when the binary is over its target's budget.
      # The budgets, and how to raise one, are in the script.
      - name: Check binary size
        run: scripts/check-binary-size.sh ${{ matrix.target }} target/${{ matrix.target }}/release/openmax
