name: CI

on:
  push:
    branches: [main]
  pull_request:
  # The checks a merge queue runs on a pull request it is about to merge,
  # once the repository has one.
  merge_group:
  # Every night on main: a new stable Rust or runner image fails here rather
  # than on the next pull request, and the caches only main saves stay warm.
  schedule:
    - cron: "41 5 * * *"

# A push to a pull request cancels the run still testing its previous head,
# whose verdict no longer decides anything. Every other run has a group of
# its own, so a push to main, a merge group or a nightly run is never
# cancelled.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

# Every step runs under bash with pipefail (bash -eo pipefail), so a pipe
# keeps the failure of each command in it, wherever it stands in a script,
# quoted or not. GitHub's default shell sets no pipefail.
defaults:
  run:
    shell: bash

env:
  CARGO_TERM_COLOR: always

# Every action is pinned to a full commit SHA, with its release in a trailing
# comment: a tag can be moved to other code after review, and these jobs run
# with this repository's token, while a commit cannot change under its SHA.
# Bump an action by replacing both. rust-toolchain is versioned by branch
# (stable, 1.97.0, ...), not by release, and its v1 tag follows master, so it is
# pinned to a dated master commit and given its toolchain as an input.
jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      # A failure on one runner cancels nothing on the other, so each
      # runner's failures are all shown, as the ci profile shows a run's.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # master, 2026-10-01
        with:
          toolchain: stable

      # Only main saves this cache, as it saves every other cache here. A copy
      # a pull request saved would serve only that pull request's later runs,
      # and rust-cache keeps no workspace crate in it, so main's copy, which
      # every pull request reads, serves them as well unless the pull request
      # changes Cargo.lock; and it would push main's out of the repository's
      # cache space.
      - name: Cache cargo
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}

      # Test builds optimize the workspace's own crates (Cargo.toml's test
      # profile), which the Suite time job times and pays for: built that way
      # the tests take 203 to 223 seconds to build on ubuntu-latest instead of
      # 35 to 37, and 425 instead of 63 on macos-latest. This job holds no time
      # budget and runs each test in a process of its own, so it builds them
      # unoptimized, as it did before: cargo reads the two settings from the
      # config in its home directory, over Cargo.toml's.
      # crates/tui/tests/thesis.rs holds this.
      - name: Build the workspace's crates unoptimized
        run: |
          mkdir -p "${CARGO_HOME:-$HOME/.cargo}"
          printf '\n[profile.test.package.open-max-core]\nopt-level = 0\n\n[profile.test.package.openmax]\nopt-level = 0\n' >> "${CARGO_HOME:-$HOME/.cargo}/config.toml"

      # cargo-nextest's release binary for the runner, checked against the
      # sha256 its release publishes before it runs, as the Mutants workflow
      # checks cargo-mutants. A bump replaces the version and both hashes.
      - name: Install cargo-nextest
        env:
          NEXTEST_VERSION: 0.9.151
        run: |
          case $RUNNER_OS-$RUNNER_ARCH in
            Linux-X64) asset=x86_64-unknown-linux-gnu sha256=1d4ce302b820c41f4b89c5fb9bce45f0f0c94882c1cf08fc360caf08be6e7df4 ;;
            macOS-*) asset=universal-apple-darwin sha256=d1d7d025d4bfc9fb154cd76aea3949bd78534829a0589abefa6e5dd4edb135dd ;;
            *) echo "::error::no cargo-nextest is pinned for $RUNNER_OS-$RUNNER_ARCH"; exit 1 ;;
          esac
          curl -sSfL --retry 3 "https://github.com/nextest-rs/nextest/releases/download/cargo-nextest-$NEXTEST_VERSION/cargo-nextest-$NEXTEST_VERSION-$asset.tar.gz" -o "$RUNNER_TEMP/cargo-nextest.tar.gz"
          echo "$sha256  $RUNNER_TEMP/cargo-nextest.tar.gz" | shasum -a 256 --check --strict -
          mkdir -p "$RUNNER_TEMP/bin"
          tar -xzf "$RUNNER_TEMP/cargo-nextest.tar.gz" -C "$RUNNER_TEMP/bin" cargo-nextest
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"

      # Every test, each in a process of its own, as many at once as the
      # runner has cores, under the ci profile of .config/nextest.toml:
      # every failure shown, none run again, a hung test stopped.
      - name: Test
        run: cargo nextest run --workspace --locked --profile ci

      # The doc tests, which nextest does not run.
      - name: Doc tests
        run: cargo test --workspace --locked --doc

      # Hard gate: a change that deletes tests fails under the floor. The
      # script counts the tests the suite just built lists, against the floor
      # of the runner's platform (each compiles a few tests the other does
      # not); it gives the method and how the floors move.
      - name: Check test count
        run: scripts/check-test-count.sh

      - name: Test repository memory example
        run: |
          cargo build --locked -p openmax
          python3 examples/repo-memory/test_repo_memory.py target/debug/openmax

      # The binary the step above built, driven by the example's own script.
      - name: Test run task example
        run: python3 examples/run-task/test_run_task.py target/debug/openmax

  # The whole suite's wall time after compilation with every test binary run
  # at once, each with a thread pool of its own, which the test job, running
  # each test in a process of its own, does not show.
  # scripts/check-suite-time.sh gives the method and the budget: 5 seconds
  # times this runner's multiplier.
  # It gates on ubuntu-latest alone, a job of its own so that no step of the
  # test job runs on one of its runners only. macos-latest, 3 shared cores,
  # ran the suite in 12.5 to 33.7 seconds over 32 runs, over its 20-second
  # budget in 19, so the Reports workflow measures it there every night
  # instead. The job builds the test job's dependencies again, and the
  # workspace's own crates as Cargo.toml's test profile gives them, so it
  # restores the cache that job saves on main and saves none of its own: the
  # repository's cache space holds no second copy. crates/tui/tests/thesis.rs
  # holds this wiring.
  suite-time:
    name: Suite time
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # master, 2026-10-01
        with:
          toolchain: stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: test
          save-if: false

      # What the check runs, so it builds nothing under its timeout.
      - name: Build the tests
        run: cargo test --workspace --locked --no-run

      - name: Check suite time
        run: scripts/check-suite-time.sh 3
        timeout-minutes: 5

  # The zero-warning baseline is only real if something checks it. It was set
  # deliberately, then drifted back to three warnings because nothing did. A
  # job of its own, beside the tests rather than after them: it builds with
  # another compiler, so it shares no build with them anyway.
  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      # Pinned, unlike the test toolchain: clippy adds lints in every
      # release, so a floating `stable` here fails an unrelated PR on the day
      # Rust ships, and the author who has to fix it is whoever pushed next.
      # Bumping this is a deliberate commit that carries its own fixes.
      - name: Clippy toolchain
        uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # master, 2026-10-01
        with:
          toolchain: 1.97.0
          components: clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Clippy
        run: cargo +1.97.0 clippy --workspace --all-targets --locked -- -D warnings

  # The thesis tests' timing assertions hold only in a release build, and the
  # test job builds in debug, so this job builds them in release, with the
  # profile the published binary ships with, on the test job's runners, and
  # runs them one test at a time, so no measurement runs beside another, each
  # printing what it measured: each test target named thesis* in the
  # workspace, and the binary's thesis_frames module on a runner that gates
  # one of its tests. What each asserts is in its doc comment; the first
  # frame is held as a ratio to a baseline binary's start, as timed from the
  # spawn it includes the runner's own process start, which is not the
  # harness's work.
  # crates/tui/tests/thesis.rs holds this wiring.
  thesis:
    name: Thesis (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        # The thesis tests a runner does not gate, as it does not meet their
        # targets with room: the gate step skips them, and the Reports
        # workflow, whose matrix lists the same tests, measures them every
        # night instead. docs/development.md names them too.
        # `frames` is whether the runner gates a test of the binary's
        # thesis_frames module. Those tests live in the binary's own
        # unit-test harness, which the release profile links as one more
        # whole-program LTO unit, the longest of the build, so a runner that
        # reports all of them builds no harness its gates would run no test
        # from.
        include:
          - os: ubuntu-latest
            reported: harness_time_per_tool_round
            frames: true
          - os: macos-latest
            reported: harness_time_per_tool_round transcript_frame_p99_at_100k_lines transcript_frame_p99_at_1m_lines
            frames: false
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # master, 2026-10-01
        with:
          toolchain: stable

      # Only main saves this one: a release build's caches on two runners
      # from every pull request would push main's out of the repository's
      # cache space.
      - name: Cache cargo
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}

      # What the gate step below runs, so it builds nothing under its
      # timeout, and the first-frame test's baseline binary, an example,
      # which `cargo test` leaves unbuilt once a target is selected.
      - name: Build release tests
        run: |
          cargo test --release --workspace --locked --no-run --test 'thesis*' ${{ matrix.frames && '--bin openmax' || '' }}
          cargo build --release --workspace --locked --example startup_baseline

      # Every thesis test but the ones this runner reports, failing the pull
      # request. Each command runs even when the one before it failed, so one
      # failing test does not hide the others' measurements.
      - name: Thesis gates
        id: gates
        timeout-minutes: 5
        run: |
          skip=; for test in ${{ matrix.reported }}; do skip="$skip --skip $test"; done
          cargo test --release --workspace --locked --test 'thesis*' --no-fail-fast -- --test-threads=1 --nocapture $skip || failed=1
          if ${{ matrix.frames }}; then
            cargo test --release --workspace --locked --bin openmax -- --test-threads=1 --nocapture thesis_frames $skip || failed=1
          fi
          exit ${failed:-0}

      # zero_orphans_after_kill_9 lists when the run it killed was collected,
      # when the run's watcher removed its record, just after its own SIGKILL,
      # and each process of the tool tree and the watcher with when it was
      # gone after the SIGKILL: the 100 ms gate's evidence, kept on each
      # runner, after a failing gate too. A missing listing fails this step
      # only when the gates passed. A re-run of the job keeps the artifacts its
      # earlier attempt uploaded, and the upload refuses a name the run already
      # holds unless it may overwrite it, so the re-run replaces it.
      - name: Keep the orphan listing
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: zero-orphans-after-kill-9-${{ matrix.os }}
          path: target/tmp/zero-orphans-after-kill-9.txt
          if-no-files-found: ${{ steps.gates.outcome == 'success' && 'error' || 'warn' }}
          overwrite: true

  # Capability is meant to land in files, not in the core: the target is that
  # at most 20% of the latest 50 commits of main change crates/core/.
  # scripts/core-share.sh gives the method; it reads only git's history and
  # builds nothing. It puts the share in the job's summary and writes one CSV
  # row for each commit, kept as the run's core-share artifact. The share is
  # reported, not gated, until it meets the target: the script exits 0
  # whatever the share, so the job fails only when it cannot measure, and
  # nothing skips the job or a step of it, or lets them fail. The checkout
  # takes the event's own commit with the whole history, since a shallow
  # clone's oldest commit would read as adding every file. On a pull request
  # that commit is GitHub's test merge of the pull request into its base,
  # whose first parent is the base, so the newest row is the pull request as a
  # squash merge would land it; a checkout of the pull request's head would
  # make a row of each of its commits. crates/tui/tests/thesis.rs holds this
  # wiring.
  core-share:
    name: Core share
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0

      - name: Measure the core share
        run: scripts/core-share.sh --csv core-share.csv

      # A re-run of this job replaces the CSV its earlier attempt kept: the
      # upload refuses a name the run already holds unless it may overwrite.
      - name: Keep the CSV
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: core-share
          path: core-share.csv
          if-no-files-found: error
          overwrite: true

  # dist's plan of a release from Cargo.toml's [workspace.metadata.dist], the
  # first thing the Release workflow does when a tag is pushed, here on every
  # pull request: a config dist cannot plan (its targets, installers, tap or
  # publish jobs, or the package metadata they read) fails the pull request
  # that makes it rather than the tag. dist is installed as the Release
  # workflow installs it, from cargo-dist's installer at the version
  # Cargo.toml names, checked against the same sha256 before it runs, and the
  # job's token only reads; crates/tui/tests/release.rs holds the two jobs to
  # each other. It builds nothing.
  release-plan:
    name: Release plan
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Install dist
        run: |
          set -euo pipefail
          curl --proto '=https' --tlsv1.2 -LsSf --retry 3 \
            https://github.com/axodotdev/cargo-dist/releases/download/v0.32.0/cargo-dist-installer.sh \
            -o "$RUNNER_TEMP/cargo-dist-installer.sh"
          echo "b657cf8c04a8b7bc28f39d220f7e6dd11bbd2bdb072c552262bd9ccf597261b5  $RUNNER_TEMP/cargo-dist-installer.sh" \
            | shasum -a 256 --check --strict -
          sh "$RUNNER_TEMP/cargo-dist-installer.sh"

      - name: Plan the release
        run: dist plan --output-format=json
