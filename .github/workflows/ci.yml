name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

# Every action is pinned to a full commit SHA, with its release in a trailing
# comment: a tag can be moved to other code after review, and these jobs run
# with this repository's token, while a commit cannot change under its SHA.
# Bump an action by replacing both. rust-toolchain is versioned by branch
# (stable, 1.97.0, ...), not by release, and its v1 tag follows master, so it is
# pinned to a dated master commit and given its toolchain as an input.
jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
        # The suite time gate's budget on each runner, as a multiple of the
        # 5-second target. scripts/check-suite-time.sh gives the reasons.
        include:
          - os: ubuntu-latest
            suite_time_multiplier: 3
          - os: macos-latest
            suite_time_multiplier: 4
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # master, 2026-10-01
        with:
          toolchain: stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Test
        run: cargo test --workspace --locked

      # Hard gate: the suite just built runs again with every test binary at
      # once and fails over its time budget, so a test that makes the suite
      # slower fails the pull request that adds it. The target is 5 seconds;
      # each runner gets the multiple of it its matrix entry sets. A test
      # that hangs only beside the others fails the step at its timeout
      # instead of holding the job until the job's own limit.
      - name: Check suite time
        run: scripts/check-suite-time.sh ${{ matrix.suite_time_multiplier }}
        timeout-minutes: 5

      # Hard gate: a change that deletes tests fails under the floor. The
      # script counts the tests the suite just built lists, against the floor
      # of the runner's platform (each compiles a few tests the other does
      # not); it gives the method and how the floors move.
      - name: Check test count
        run: scripts/check-test-count.sh

      # The zero-warning baseline is only real if something checks it. It was
      # set deliberately, then drifted back to three warnings because nothing
      # did.
      #
      # Pinned, unlike the test toolchain above: clippy adds lints in every
      # release, so a floating `stable` here fails an unrelated PR on the day
      # Rust ships, and the author who has to fix it is whoever pushed next.
      # Bumping this is a deliberate commit that carries its own fixes.
      - name: Clippy toolchain
        if: matrix.os == 'ubuntu-latest'
        uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # master, 2026-10-01
        with:
          toolchain: 1.97.0
          components: clippy

      - name: Clippy
        if: matrix.os == 'ubuntu-latest'
        run: cargo +1.97.0 clippy --workspace --all-targets --locked -- -D warnings

  # The thesis tests' timing assertions hold only in a release build, and the
  # test job builds in debug, so this job builds them in release, with the
  # profile the published binary ships with, on the test job's runners, and
  # runs them one test at a time, so no measurement runs beside another, each
  # printing what it measured: each test target named thesis* in the
  # workspace and the binary's thesis_frames module. What each asserts is in
  # its doc comment; the first frame is held as a ratio to a baseline
  # binary's start, as timed from the spawn it includes the runner's own
  # process start, which is not the harness's work.
  # crates/tui/tests/thesis.rs holds this wiring.
  thesis:
    name: Thesis (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        # The thesis tests a runner reports instead of gating, as it does not
        # meet their targets with room; the reports step gives the numbers.
        # README.md names them too.
        include:
          - os: ubuntu-latest
            reported: harness_time_per_tool_round
          - os: macos-latest
            reported: harness_time_per_tool_round transcript_frame_p99_at_100k_lines
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # master, 2026-10-01
        with:
          toolchain: stable

      # Only main saves this one: a release build's caches on two runners
      # from every pull request would push main's out of the repository's
      # cache space.
      - name: Cache cargo
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}

      # What the two steps below run, so they build nothing under their
      # timeouts, and the first-frame test's baseline binary, an example,
      # which `cargo test` leaves unbuilt once a target is selected.
      - name: Build release tests
        run: |
          cargo test --release --workspace --locked --no-run --test 'thesis*' --bin openmax
          cargo build --release --workspace --locked --example startup_baseline

      # The tests this runner reports, run to print their numbers, which also
      # go to the job's summary, and allowed to fail, until it meets their
      # targets with room. A step after a failed one is skipped, so this one
      # runs before the gate step and prints its numbers whatever the gates
      # do; its own failure, allowed, skips nothing. Over this job's first
      # runs, six on ubuntu-latest and seven on macos-latest, the runners
      # took about twice as long as the reference machine, an Apple M5, on
      # the same single-threaded work, a transcript frame, and from one run
      # to the next their times swung by more than the targets' room. The
      # harness time per tool round, a median of 156 to 186 us on the M5
      # against its 250 us target, measured 237 to 374 us on ubuntu-latest
      # and 260 to 659 us on macos-latest. The frame's p99 at 100,000 lines,
      # 0.074 to 0.090 ms on the M5 against 0.5 ms, measured 0.157 to
      # 0.240 ms on ubuntu-latest, where it gates, and 0.151 to 0.504 ms on
      # macos-latest, past the bound in two runs and within a fifth of it in
      # two more, while its median held at 0.118 to 0.169 ms.
      - name: Thesis reports
        continue-on-error: true
        timeout-minutes: 5
        run: |
          [ -n "${{ matrix.reported }}" ] || exit 0
          cargo test --release --workspace --locked --test 'thesis*' --bin openmax --no-fail-fast -- --test-threads=1 --nocapture ${{ matrix.reported }} 2>&1 | tee "$RUNNER_TEMP/thesis-reports.log"
          status=${PIPESTATUS[0]}
          { echo "Reported, not gated, on ${{ matrix.os }}; cargo test exited $status:"; echo '```'; sed -n 's/.*MEASURE /MEASURE /p' "$RUNNER_TEMP/thesis-reports.log"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          exit "$status"

      # Every thesis test but the ones this runner reports, failing the pull
      # request. Each command runs even when the one before it failed, so one
      # failing test does not hide the others' measurements.
      - name: Thesis gates
        timeout-minutes: 5
        run: |
          skip=; for test in ${{ matrix.reported }}; do skip="$skip --skip $test"; done
          cargo test --release --workspace --locked --test 'thesis*' --no-fail-fast -- --test-threads=1 --nocapture $skip || failed=1
          cargo test --release --workspace --locked --bin openmax -- --test-threads=1 --nocapture thesis_frames $skip || failed=1
          exit ${failed:-0}

  # A release tag builds every target in Cargo.toml's [workspace.metadata.dist]
  # and publishes nothing unless all of them build, so each one is built here,
  # on the runner `dist plan` assigns it and with the packages the release
  # installs there, and a target that stops building fails the pull request
  # that broke it instead of the next release. crates/tui/tests/release.rs
  # keeps this matrix equal to the published targets and their runners.
  release-build:
    name: Release build (${{ matrix.target }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            runner: macos-15
          - target: x86_64-apple-darwin
            runner: macos-15-intel
          - target: aarch64-unknown-linux-gnu
            runner: ubuntu-22.04-arm
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-22.04
          - target: aarch64-unknown-linux-musl
            runner: ubuntu-22.04-arm
          - target: x86_64-unknown-linux-musl
            runner: ubuntu-22.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      # ring compiles C, and a musl target needs musl's C toolchain for it.
      - name: Install musl tools
        if: endsWith(matrix.target, '-musl')
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # master, 2026-10-01
        with:
          toolchain: stable
          targets: ${{ matrix.target }}

      # Only main saves these: six targets' caches from every pull request
      # would push main's out of the repository's cache space.
      - name: Cache cargo
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: ${{ matrix.target }}
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Build release binary
        run: cargo build --release -p openmax --locked --target ${{ matrix.target }}

      # Hard gate: the job fails when the binary is over its target's budget.
      # The budgets, and how to raise one, are in the script.
      - name: Check binary size
        run: scripts/check-binary-size.sh ${{ matrix.target }} target/${{ matrix.target }}/release/openmax
