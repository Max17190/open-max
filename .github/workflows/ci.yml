name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Test
        run: cargo test --workspace --locked

      # The zero-warning baseline is only real if something checks it. It was
      # set deliberately, then drifted back to three warnings because nothing
      # did.
      #
      # Pinned, unlike the test toolchain above: clippy adds lints in every
      # release, so a floating `stable` here fails an unrelated PR on the day
      # Rust ships, and the author who has to fix it is whoever pushed next.
      # Bumping this is a deliberate commit that carries its own fixes.
      - name: Clippy toolchain
        if: matrix.os == 'ubuntu-latest'
        uses: dtolnay/rust-toolchain@1.97.0
        with:
          components: clippy

      - name: Clippy
        if: matrix.os == 'ubuntu-latest'
        run: cargo +1.97.0 clippy --workspace --all-targets --locked -- -D warnings

      - name: Skill script tests
        run: .agents/skills/delegate/scripts/test-openmax-tmux

  release-build:
    name: Release build (Ubuntu)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Build release binary
        run: cargo build --release -p open-max-tui --locked

      # Soft gate: warn via workflow annotation, but do not fail the job.
      - name: Check binary size
        run: |
          BIN=target/release/openmax
          MAX_BYTES=$((8 * 1024 * 1024))
          SIZE=$(stat -c%s "$BIN")
          SIZE_MB=$(awk "BEGIN {printf \"%.2f\", $SIZE / 1024 / 1024}")
          echo "Binary size: ${SIZE_MB} MB ($SIZE bytes); soft limit: 8 MB"
          if [ "$SIZE" -gt "$MAX_BYTES" ]; then
            echo "::warning::openmax binary is ${SIZE_MB} MB (soft limit: 8 MB)"
          else
            echo "Binary size is within the 8 MB soft limit."
          fi
