name: Suite reruns A/B

# Temporary: red records for this branch on CI's Linux runner. Removed
# before review.
on:
  push:
    branches: [test/stop-the-suite-time-reruns]

defaults:
  run:
    shell: bash

env:
  CARGO_TERM_COLOR: always

jobs:
  churn:
    name: Ports under churn (${{ matrix.tree }})
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        tree: [before, after]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # master, 2026-10-01
        with:
          toolchain: stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: test
          save-if: false

      - name: Tree
        run: |
          if [ "${{ matrix.tree }}" = before ]; then
            git fetch --depth=1 origin main
            git checkout FETCH_HEAD -- crates/core/src/client.rs crates/tui/tests/cli.rs crates/tui/src/app/thesis_frames.rs
          fi
          git status --short

      - name: Build the tests
        run: cargo test --workspace --locked --no-run

      - name: Churn
        timeout-minutes: 25
        run: |
          cat > "$RUNNER_TEMP/churn.py" <<'EOF'
          import random, socket, sys, threading, time
          low, high = map(int, open("/proc/sys/net/ipv4/ip_local_port_range").read().split())
          half = low + (((high + 1 - low) >> 2) << 1)
          # A bind of port 0 with SO_REUSEADDR (Rust's TcpListener) first tries
          # the odd ports of the lower half of the range, from a random one.
          odd = list(range(low + 1, half, 2))
          free = set(random.sample(odd, int(sys.argv[1])))
          held = []
          for port in odd:
              if port in free:
                  continue
              s = socket.socket()
              s.setsockopt(socket.SOL_SOCKET, socket.SO_REUSEADDR, 1)
              try:
                  s.bind(("127.0.0.1", port)); s.listen(1); held.append(s)
              except OSError:
                  pass
          print(f"range {low}-{high}, lower half to {half}: squatted {len(held)} of {len(odd)} odd ports, free {sorted(free)}", flush=True)
          grabs = {}
          def churn(hold):
              while True:
                  s = socket.socket()
                  s.setsockopt(socket.SOL_SOCKET, socket.SO_REUSEADDR, 1)
                  s.bind(("127.0.0.1", 0)); s.listen(8)
                  port = s.getsockname()[1]
                  grabs[port] = grabs.get(port, 0) + 1
                  time.sleep(hold); s.close(); time.sleep(hold / 2)
          for hold in map(float, sys.argv[2:]):
              threading.Thread(target=churn, args=(hold,), daemon=True).start()
          while True:
              time.sleep(10)
              print("grabs", sorted(grabs.items(), key=lambda kv: -kv[1])[:12], flush=True)
          EOF
          ulimit -n 65536 || true
          ulimit -n
          python3 -I "$RUNNER_TEMP/churn.py" 8 0.001 0.002 0.003 0.005 > "$RUNNER_TEMP/churn.log" 2>&1 &
          churner=$!
          sleep 3
          head -n 1 "$RUNNER_TEMP/churn.log"
          lib=$(cargo test -p open-max-core --lib --locked --no-run --message-format=json 2>/dev/null | python3 -I -c 'import json,sys
          for l in sys.stdin:
              m = json.loads(l)
              if m.get("reason") == "compiler-artifact" and m.get("executable") and m["profile"]["test"] and m["target"]["kind"] == ["lib"]: print(m["executable"])')
          cli=$(cargo test -p openmax --test cli --locked --no-run --message-format=json 2>/dev/null | python3 -I -c 'import json,sys
          for l in sys.stdin:
              m = json.loads(l)
              if m.get("reason") == "compiler-artifact" and m.get("executable") and m["profile"]["test"] and m["target"]["name"] == "cli": print(m["executable"])')
          echo "lib $lib"; echo "cli $cli"
          mkdir -p "$RUNNER_TEMP/out"
          for test in client::tests::unreached_retry_line_counts_unreached_attempts client::tests::an_address_that_never_answers_gives_up_before_the_budget; do
            failed=0
            for i in $(seq 300); do
              (cd crates/core && "$lib" --exact "$test" > "$RUNNER_TEMP/out/lib-$i.log" 2>&1) || { failed=$((failed + 1)); [ "$failed" -gt 3 ] || sed -n '/^---- /,/^failures:$/p' "$RUNNER_TEMP/out/lib-$i.log"; }
            done
            echo "RESULT ${{ matrix.tree }} $test: $failed of 300 failed"
          done
          failed=0
          for i in $(seq 40); do
            (cd crates/tui && "$cli" --exact refused_connection_names_the_host_and_the_cause > "$RUNNER_TEMP/out/cli-$i.log" 2>&1) || { failed=$((failed + 1)); [ "$failed" -gt 2 ] || sed -n '/^---- /,/^failures:$/p' "$RUNNER_TEMP/out/cli-$i.log" | head -n 30; }
          done
          echo "RESULT ${{ matrix.tree }} refused_connection_names_the_host_and_the_cause: $failed of 40 failed"
          kill "$churner"
          tail -n 3 "$RUNNER_TEMP/churn.log"

  load:
    name: Frames under load (${{ matrix.tree }})
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        tree: [before, after]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # master, 2026-10-01
        with:
          toolchain: stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: test
          save-if: false

      - name: Tree
        run: |
          if [ "${{ matrix.tree }}" = before ]; then
            git fetch --depth=1 origin main
            git checkout FETCH_HEAD -- crates/core/src/client.rs crates/tui/tests/cli.rs crates/tui/src/app/thesis_frames.rs
          fi
          git status --short

      - name: Build the tests
        run: cargo test -p openmax --bin openmax --locked --no-run

      - name: Load
        timeout-minutes: 25
        run: |
          bin=$(cargo test -p openmax --bin openmax --locked --no-run --message-format=json 2>/dev/null | python3 -I -c 'import json,sys
          for l in sys.stdin:
              m = json.loads(l)
              if m.get("reason") == "compiler-artifact" and m.get("executable") and m["profile"]["test"] and m["target"]["kind"] == ["bin"]: print(m["executable"])')
          echo "bin $bin"
          nproc
          cd crates/tui
          for load in 0 12; do
            pids=
            for _ in $(seq "$load"); do (while :; do :; done) & pids="$pids $!"; done
            failed=0
            for i in $(seq 10); do
              "$bin" --exact app::thesis_frames::transcript_frame_p99_at_1m_lines app::thesis_frames::transcript_frame_p99_at_100k_lines --nocapture > "$RUNNER_TEMP/frames-$load-$i.log" 2>&1 || failed=$((failed + 1))
              grep -E '^MEASURE .*(idle|scrolling)' "$RUNNER_TEMP/frames-$load-$i.log" | sed "s/^/load=$load run=$i /" || true
              grep -E 'panicked|sanity bound' "$RUNNER_TEMP/frames-$load-$i.log" | sed "s/^/load=$load run=$i /" || true
            done
            [ -z "$pids" ] || kill $pids
            echo "RESULT ${{ matrix.tree }} frames with $load busy loops: $failed of 10 failed"
          done

  suite:
    name: Suite time, interleaved
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # master, 2026-10-01
        with:
          toolchain: stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: test
          save-if: false

      - name: Build both trees
        run: |
          git fetch --depth=1 origin main
          git worktree add "$RUNNER_TEMP/before" FETCH_HEAD
          cargo test --workspace --locked --no-run
          (cd "$RUNNER_TEMP/before" && CARGO_TARGET_DIR="$GITHUB_WORKSPACE/target" cargo test --workspace --locked --no-run)

      - name: Before and after, interleaved
        timeout-minutes: 40
        run: |
          mkdir -p "$RUNNER_TEMP/ab"
          for i in $(seq 12); do
            for v in before after; do
              dir=$GITHUB_WORKSPACE
              [ "$v" = after ] || dir=$RUNNER_TEMP/before
              load=$(cut -d ' ' -f 1 /proc/loadavg)
              code=0
              (cd "$dir" && CARGO_TARGET_DIR="$GITHUB_WORKSPACE/target" env -u GITHUB_ACTIONS scripts/check-suite-time.sh 3) > "$RUNNER_TEMP/ab/$v-$i.log" 2>&1 || code=$?
              took=$(grep -oE 'the test suite took [0-9.]+s' "$RUNNER_TEMP/ab/$v-$i.log" | grep -oE '[0-9.]+s' || echo none)
              alone=$(grep -c 'failed beside the other binaries and passed alone' "$RUNNER_TEMP/ab/$v-$i.log" || true)
              names=$(grep -oE "^thread '[^']+'" "$RUNNER_TEMP/ab/$v-$i.log" | sort -u | tr '\n' ' ' || true)
              echo "AB $v $i exit=$code took=$took retried=$alone load=$load $names"
            done
          done
          for f in "$RUNNER_TEMP"/ab/after-1.log "$RUNNER_TEMP"/ab/before-1.log; do echo "== $f"; cat "$f"; done
