name: Suite time A/B

# Temporary: compares the suite time check on main and on this branch on one
# runner, interleaved, each tree with its own build. Removed before review.
on:
  push:
    branches: [test/suite-time-headroom]

defaults:
  run:
    shell: bash

env:
  CARGO_TERM_COLOR: always

jobs:
  ab:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # master, 2026-10-01
        with:
          toolchain: stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: test
          save-if: false

      - name: Build both trees
        run: |
          base=$(git merge-base HEAD origin/main)
          echo "before: $base; after: $(git rev-parse HEAD)"
          git worktree add -q --detach "$RUNNER_TEMP/before" "$base"
          cp -a target "$RUNNER_TEMP/target-before"
          cargo test --workspace --locked --no-run
          (cd "$RUNNER_TEMP/before" && CARGO_TARGET_DIR="$RUNNER_TEMP/target-before" cargo test --workspace --locked --no-run)

      - name: Before and after, interleaved
        timeout-minutes: 30
        run: |
          mkdir -p ab
          busy() { awk '/^cpu /{ print $2+$3+$4+$7+$8 }' /proc/stat; }
          for i in $(seq 12); do
            for v in before after; do
              b=$(busy)
              if [ "$v" = before ]; then
                (cd "$RUNNER_TEMP/before" && CARGO_TARGET_DIR="$RUNNER_TEMP/target-before" env -u GITHUB_ACTIONS scripts/check-suite-time.sh 3) > "ab/$v-$i.log" 2>&1 && code=0 || code=$?
              else
                env -u GITHUB_ACTIONS scripts/check-suite-time.sh 3 > "ab/$v-$i.log" 2>&1 && code=0 || code=$?
              fi
              a=$(busy)
              took=$(grep -oE 'the test suite took [0-9.]+s' "ab/$v-$i.log" | grep -oE '[0-9.]+s' || echo none)
              retried=$(grep -c 'failed beside the other binaries and passed alone' "ab/$v-$i.log" || true)
              names=$(grep -oE "^thread '[^']+'" "ab/$v-$i.log" | sort -u | tr '\n' ' ' || true)
              echo "AB $v $i exit=$code took=$took cpu=$(echo "($a - $b) / $(getconf CLK_TCK)" | bc -l | cut -c1-6) retried=$retried $names"
            done
          done | tee ab/summary.txt
          for v in before after; do
            echo "$v: $(grep "^AB $v " ab/summary.txt | grep -oE 'took=[0-9.]+' | cut -d= -f2 | sort -n | tr '\n' ' ')"
            echo "$v cpu: $(grep "^AB $v " ab/summary.txt | grep -oE 'cpu=[0-9.]+' | cut -d= -f2 | sort -n | tr '\n' ' ')"
          done
          cat ab/after-1.log ab/before-1.log

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() }}
        with:
          name: suite-time-ab
          path: ab
