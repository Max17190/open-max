name: Thesis (macOS)

# ci.yml's thesis job on macos-latest. Its release build of the binary, one
# whole-program LTO unit built on one core, took 150 to 220 seconds there,
# the longest job of the pull-request gate, so every pull request waited on
# it. It gates main instead, as the Release build workflow does: on every
# push to main, so the merge that breaks a macOS bound fails within minutes
# of landing; every night, as a new stable Rust or runner image can break one
# with no commit at all; on every merge group, so that a merge queue, once
# the repository has one, keeps the change out of main; and on demand on any
# branch, so a pull request that changes what these tests measure can run
# them before it merges: `gh workflow run thesis-macos.yml --ref <branch>`.
# ci.yml's thesis job keeps gating every pull request on ubuntu-latest.
# crates/tui/tests/thesis.rs holds this wiring.
on:
  push:
    branches: [main]
  merge_group:
  schedule:
    - cron: "11 6 * * *"
  workflow_dispatch:

permissions:
  contents: read

# bash with pipefail, as in ci.yml.
defaults:
  run:
    shell: bash

env:
  CARGO_TERM_COLOR: always

# Every action is pinned to a full commit SHA, with its release in a trailing
# comment, as ci.yml explains.
jobs:
  # ci.yml's thesis job on macos-latest, step for step. The thesis tests'
  # timing assertions hold only in a release build, so this job builds them
  # in release, with the profile the published binary ships with, and
  # runs them one test at a time, so no measurement runs beside another, each
  # printing what it measured: each test target named thesis* in the
  # workspace, and the binary's thesis_frames module on a runner that gates
  # one of its tests. What each asserts is in its doc comment; the first
  # frame is held as a ratio to a baseline binary's start, as timed from the
  # spawn it includes the runner's own process start, which is not the
  # harness's work.
  # Each runner's thesis tests are split between two jobs by test target
  # name (`tests`), so their release links run on two machines at once:
  # each is a whole-program LTO unit built on one core, and in one job
  # their build took 74 to 196 seconds on macos-latest, against 9 to 18
  # for the gates. `thesis` builds the binary that its tests and the tui's run;
  # `thesis_rounds` builds the binary's unit-test harness where the runner
  # gates one of its tests. Every thesis* test target in the workspace is
  # one of the two.
  # crates/tui/tests/thesis.rs holds this wiring.
  thesis:
    name: Thesis (${{ matrix.os }}, ${{ matrix.tests }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest]
        tests: [thesis, thesis_rounds]
        # The thesis tests a runner does not gate, as it does not meet their
        # targets with room: the gate step skips them, and the Reports
        # workflow, whose matrix lists the same tests, measures them every
        # night instead. docs/development.md names them too.
        # `frames` is whether the runner gates a test of the binary's
        # thesis_frames module. Those tests live in the binary's own
        # unit-test harness, which the release profile links as one more
        # whole-program LTO unit, the longest of the build, so a runner that
        # reports all of them builds no harness its gates would run no test
        # from, and one that gates them builds it in its `thesis_rounds`
        # job, beside the shortest link.
        include:
          - os: macos-latest
            reported: harness_time_per_tool_round transcript_frame_p99_at_100k_lines transcript_frame_p99_at_1m_lines
            frames: false
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # master, 2026-10-01
        with:
          toolchain: stable

      # Only main saves this one, as ci.yml's jobs do.
      - name: Cache cargo
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}

      # What the gate step below runs, so it builds nothing under its
      # timeout, and the first-frame test's baseline binary, an example,
      # which `cargo test` leaves unbuilt once a target is selected.
      - name: Build release tests
        run: |
          cargo test --release --workspace --locked --no-run --test ${{ matrix.tests }} ${{ matrix.frames && matrix.tests == 'thesis_rounds' && '--bin openmax' || '' }}
          cargo build --release --workspace --locked --example startup_baseline

      # Every thesis test but the ones this runner reports, failing the run. Each command runs even when the one before it failed, so one
      # failing test does not hide the others' measurements.
      - name: Thesis gates
        id: gates
        timeout-minutes: 5
        run: |
          skip=; for test in ${{ matrix.reported }}; do skip="$skip --skip $test"; done
          cargo test --release --workspace --locked --test ${{ matrix.tests }} --no-fail-fast -- --test-threads=1 --nocapture $skip || failed=1
          if ${{ matrix.frames && matrix.tests == 'thesis_rounds' }}; then
            cargo test --release --workspace --locked --bin openmax -- --test-threads=1 --nocapture thesis_frames $skip || failed=1
          fi
          exit ${failed:-0}

      # zero_orphans_after_kill_9 lists when the run it killed was collected,
      # when the run's watcher removed its record, just after its own SIGKILL,
      # and each process of the tool tree and the watcher with when it was
      # gone after the SIGKILL: the 100 ms gate's evidence, kept on each
      # runner by its `thesis` job, whose tui thesis tests write it, after a
      # failing gate too. A missing listing fails this step only when the
      # gates passed, and never in the `thesis_rounds` job, which writes none. A re-run of the job keeps the artifacts its
      # earlier attempt uploaded, and the upload refuses a name the run already
      # holds unless it may overwrite it, so the re-run replaces it.
      - name: Keep the orphan listing
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: zero-orphans-after-kill-9-${{ matrix.os }}
          path: target/tmp/zero-orphans-after-kill-9.txt
          if-no-files-found: ${{ matrix.tests != 'thesis' && 'ignore' || steps.gates.outcome == 'success' && 'error' || 'warn' }}
          overwrite: true
