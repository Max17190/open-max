name: Thesis timings (temporary)

# A one-off measurement, removed in the next commit: where the thesis job's
# release build spends its time on macos-latest, built whole and split by
# package, with cargo's per-unit timings kept as artifacts.
on:
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  timings:
    name: Thesis timings (${{ matrix.part }})
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - part: all
            build: cargo test --release --workspace --locked --no-run --test 'thesis*' --bin openmax --timings
          - part: core
            build: cargo test --release -p open-max-core --locked --no-run --test 'thesis*' --timings
          - part: tui
            build: cargo test --release -p openmax --locked --no-run --test 'thesis*' --bin openmax --timings
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # master, 2026-10-01
        with:
          toolchain: stable

      # The thesis job's own cache, never saved from here.
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: thesis
          save-if: false

      - run: ${{ matrix.build }}

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: thesis-timings-${{ matrix.part }}
          path: target/cargo-timings/cargo-timing.html
          if-no-files-found: error
