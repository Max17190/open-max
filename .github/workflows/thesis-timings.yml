name: Thesis timings (temporary measurement)

# Temporary: cargo --timings of the macOS thesis build with and without the
# binary's unit-test harness, on one runner, then removed.
on:
  push:
    branches: [ci/build-only-the-thesis-targets-a-runner-gates]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: never

jobs:
  timings:
    name: Thesis timings (macos-latest)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # master, 2026-10-01
        with:
          toolchain: stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: thesis
          save-if: false

      - name: Time the builds
        shell: bash
        run: |
          set -eo pipefail
          out="$RUNNER_TEMP/timings"
          mkdir -p "$out"
          sysctl -n hw.ncpu hw.memsize machdep.cpu.brand_string | tee "$out/machine.txt"
          for set in after before after-j4; do
            cargo clean --release -p open-max-core -p openmax
            case $set in
              before) extra=(--bin openmax) ;;
              after-j4) extra=(-j 4) ;;
              *) extra=() ;;
            esac
            sysctl vm.swapusage | tee "$out/$set-swap-before.txt"
            start=$(date +%s)
            /usr/bin/time -l cargo test --release --workspace --locked --no-run --test 'thesis*' "${extra[@]}" --timings 2> "$out/$set-build.txt"
            echo "$set: $(( $(date +%s) - start )) s" | tee -a "$out/summary.txt"
            sysctl vm.swapusage | tee "$out/$set-swap-after.txt"
            cp target/cargo-timings/cargo-timing.html "$out/$set.html"
            tail -25 "$out/$set-build.txt"
          done

      - name: Keep the timings
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: thesis-timings
          path: ${{ runner.temp }}/timings
