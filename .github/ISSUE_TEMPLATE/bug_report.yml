name: Bug report
description: Something in Open Max does not work as documented.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        To report a vulnerability, do not open an issue: follow [SECURITY.md](https://github.com/Max17190/open-max/blob/main/SECURITY.md).
  - type: input
    id: version
    attributes:
      label: Version
      description: Output of `openmax --version`.
      placeholder: openmax 2026.11.4
    validations:
      required: true
  - type: dropdown
    id: install
    attributes:
      label: Install method
      options:
        - Shell installer (useopenmax.dev/install.sh)
        - Homebrew
        - npm or bun (openmax-cli)
        - Built from source
    validations:
      required: true
  - type: input
    id: platform
    attributes:
      label: Platform
      description: Operating system and architecture.
      placeholder: macOS 15, arm64
    validations:
      required: true
  - type: input
    id: model
    attributes:
      label: Model and endpoint
      description: The provider or base URL and the model id. Leave out any key.
      placeholder: an OpenAI-compatible gateway, deepseek/deepseek-v4.1-flash
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected, and what happened instead
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Output or session events
      description: Terminal output, or the relevant lines of the session's events. Remove keys and anything private first.
      render: text
