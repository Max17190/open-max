# The completion gate of run_task.py. Install it once:
#   cp examples/run-task/run-task-checks.toml ~/.openmax/hooks/
# It judges only a turn that run_task.py started: every other session has no
# RUN_TASK_DIR, and the hook exits 0 at once.
event = "turn_end"
blocking = true
command = "sh"
args = ["-c", "[ -z \"$RUN_TASK_DIR\" ] || exec python3 \"$RUN_TASK_DIR/run_task_checks.py\""]
timeout_secs = 60
