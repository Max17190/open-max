[workspace]
resolver = "2"
members = ["crates/core", "crates/tui"]

[workspace.package]
version = "0.2.0"
edition = "2021"
license = "MIT"
authors = ["Open Max contributors"]
repository = "https://github.com/Max17190/open-max"
# `homepage` and each package's `description` are what the generated Homebrew
# formula shows; without them the formula is anonymous.
homepage = "https://github.com/Max17190/open-max"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["raw_value"] }
# Only the runtime pieces the harness uses; "full" would drag in the rest.
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "process", "io-util", "fs", "signal"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "stream"] }
futures-util = { version = "0.3", default-features = false, features = ["std"] }
regex = "1"
ignore = "0.4"
globset = "0.4"
similar = "2"
uuid = { version = "1", features = ["v4"] }
fs2 = "0.4"
# Content hashes for the capability ledger (objects are addressed by sha256).
sha2 = "0.10"
# Hand-authored external-tool configs (.openmax/tools/*.toml); parse only.
toml = { version = "0.8", default-features = false, features = ["parse"] }
libc = "0.2"

# Prebuilt binaries, so installing does not require a Rust toolchain. Tagging
# `v<version>` builds every target below and publishes them to a GitHub Release
# with a shell installer. Unix only: the harness has 32 `cfg(unix)` blocks and
# no Windows implementation, so no Windows target or PowerShell installer.
#
# `.github/workflows/release.yml` is generated from this config by
# `dist generate`, with ONE hand-edit: the "Install dist" step fetches the
# upstream installer, checks it against a pinned sha256, and only then runs it,
# because that job holds `contents: write` and its `dist` binary is what
# publishes the release.
#
# `allow-dirty = ["ci"]` is what lets that edit survive: without it `dist plan`
# fails the job because the checked-in workflow no longer matches what it would
# generate. The cost is that dist will no longer update the workflow for us, so
# bumping cargo-dist-version below means regenerating by hand, re-applying the
# verification step, and re-pinning its hash in the same commit.
[workspace.metadata.dist]
cargo-dist-version = "0.32.0"
ci = "github"
installers = ["shell", "homebrew", "npm"]
# Homebrew's core tap does not accept third-party prebuilt binaries, so the
# formula goes to a tap we own. `publish-jobs` is what actually pushes it on a
# tagged release; without it the formula is only a release asset and the tap
# stays empty. The push needs a HOMEBREW_TAP_TOKEN secret, because the
# workflow's own GITHUB_TOKEN cannot write to another repository.
tap = "Max17190/homebrew-tap"
publish-jobs = ["homebrew", "npm"]
allow-dirty = ["ci"]
targets = [
    "aarch64-apple-darwin",
    "x86_64-apple-darwin",
    "aarch64-unknown-linux-gnu",
    "x86_64-unknown-linux-gnu",
    "aarch64-unknown-linux-musl",
    "x86_64-unknown-linux-musl",
]
# The harness already owns ~/.openmax for settings and sessions, so the binary
# lands beside them and uninstalling is removing one directory. Installing into
# ~/.cargo/bin would fake a Rust install on a machine that needs no Rust.
install-path = "~/.openmax/bin"
install-updater = false

# Lean, fast binaries: thin LTO and symbol stripping keep the harness tiny so
# the model gets the machine.
[profile.release]
lto = "thin"
codegen-units = 1
strip = true
opt-level = "s"

# cargo-dist builds with `--profile dist`. Inherit release so a published binary
# carries the same thin LTO, one codegen unit, stripped symbols and size
# optimization the CI size gate measures, rather than a second, untuned shape.
[profile.dist]
inherits = "release"
