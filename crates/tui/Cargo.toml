[package]
name = "openmax"
description = "Open Max: barebones high-performance agent harness TUI"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true

# The npm package cannot be called `openmax`: that name belongs to an unrelated
# 2015 media-library binding that is still published. The BINARY is unaffected
# and stays `openmax`, so the package name is only ever typed at install time.
[package.metadata.dist]
npm-package = "openmax-cli"

[[bin]]
name = "openmax"
path = "src/main.rs"

[dependencies]
open-max-core = { path = "../core" }
ratatui = "0.30.2"
crossterm = { version = "0.29", features = ["event-stream"] }
tokio.workspace = true
futures-util.workspace = true
serde.workspace = true
serde_json.workspace = true
lexopt = "0.3"
unicode-width = "0.2"
unicode-segmentation = "1.13"
ignore.workspace = true
