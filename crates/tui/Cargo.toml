[package]
name = "openmax"
description = "Open Max: barebones high-performance agent harness TUI"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true

# The npm package cannot be called `openmax`: that name belongs to an unrelated
# 2015 media-library binding that is still published. The BINARY is unaffected
# and stays `openmax`, so the package name is only ever typed at install time.
[package.metadata.dist]
npm-package = "openmax-cli"

[[bin]]
name = "openmax"
path = "src/main.rs"

[dependencies]
open-max-core = { path = "../core" }
# Only the crossterm backend. The defaults add the calendar widget (and the
# `time` crate family behind it), ratatui-macros and a layout cache, none of
# which the TUI calls; the crossterm backend still enables underline colors.
ratatui = { version = "0.30.2", default-features = false, features = ["crossterm"] }
crossterm = { version = "0.29", features = ["event-stream"] }
tokio.workspace = true
futures-util.workspace = true
serde.workspace = true
serde_json.workspace = true
lexopt = "0.3"
unicode-width = "0.2"
unicode-segmentation = "1.13"
ignore.workspace = true
# SIGTERM for an MCP server still running after `--mcp-call` or `--mcp-list`
# closed its stdin. The CLI tests also use it to give a child a
# pseudo-terminal on stdin, which is how an interactive shell runs openmax.
libc.workspace = true

[dev-dependencies]
# The release test reads Cargo.toml the way cargo-dist does, as TOML.
toml.workspace = true
# Paused time: print mode's wait on a quiet turn is checked across an hour
# that passes in no real time.
tokio = { workspace = true, features = ["test-util"] }

# The MCP bridge tests run their own binary again as a fixture MCP server. A
# libtest binary prints its banner on stdout before any test runs, and stdout
# is that server's protocol channel, so this target supplies its own main.
[[test]]
name = "mcp_bridge"
harness = false
